<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Earl Evan Amante">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>OSS 2.0</title>
    <style>
        html, body {
            font-family: "Arial Black", sans-serif;
            margin: 0;
        }
        div {
            box-sizing: border-box;
        }
        .wrapper {
            min-width: 100vw;
            min-height: 100vh;
        }
        select {
            background-color: transparent;
            border: 1px solid black;
            padding: 10px 30px;
            font-size: 32px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        option {
            color: #000;
        }
        .menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding-top: 30px;
        }
        #group {
            background-color: white;
        }
        .scoreboard {
            display: flex;
        }
        button {
            width: 64px;
            height: 64px;
            cursor: pointer;
            font-size: 32px;
        }
        button img {
            width: 100%;
        }
        #change-court {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .score {
            margin-top: 50px;
            margin-bottom: 50px;
            font-family: Monospace,serif;
            font-size: 300px;
            cursor: pointer;
            line-height: 1;
        }
        #left.panel.white {
            border-right: 1px solid #c0c0c0;
        }
        .panel {
            font-weight: bold;
            padding: 150px 30px 30px;
            height: 100vh;
            text-align: center;
            width: 50%;
        }
        .panel.green {
            background-color: #006400;
            color: white;
        }
        .panel.green select {
            color: white;
            border-color: white;
        }
        .panel.black {
            background-color: black;
            color: white;
        }
        .panel.black select {
            color: white;
            border-color: white;
        }
        .panel.brown {
            background-color: #bf5b04;
            color: white;
        }
        .panel.brown select {
            color: white;
            border-color: white;
        }
        #reset {
            position: fixed;
            top: 5px;
            left: 5px;
            z-index: 999;
            background-color: #c0c0c0;
            display: flex;
            width: 32px;
            height: 32px;
        }
        @media (max-width: 479px) {
            #left.panel.white {
                border-right: 0;
                border-bottom: 1px solid #c0c0c0;
            }
            .menu {
                padding-top: 10px;
            }
            select {
                font-size: 18px;
            }
            .scoreboard {
                flex-direction: column;
            }
            .panel {
                padding-top: 80px;
                height: 50vh;
                width: 100%;
            }
            .score {
                margin-top: 10px;
                margin-bottom: 10px;
                font-size: 200px;
            }
            .panel button {
                width: 48px;
                height: 48px;
                font-size: 21px;
            }
            #change-court {
                left: initial;
                right: 5px;
            }
        }
        @media (max-width: 991px) {
            .menu {
                padding-top: 5px;
            }
            select {
                font-size: 16px;
                padding: 5px;
            }
            .panel {
                padding-top: 50px;
            }
            .score {
                margin-top: 10px;
                margin-bottom: 10px;
                font-size: 180px;
            }
            .panel button {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <a href="#" id="reset"><img src="reset.png" alt="Reset"></a>
    <div class="wrapper">
        <div class="menu">
            <select id="group">
                <option value="Group A">Group A</option>
                <option value="Group B">Group B</option>
                <option value="Group C">Group C</option>
            </select>
            <br>
            <br>
            <button id="change-court"><img src="transfer.png" alt="Transfer"></button>
        </div>
        <div class="scoreboard">
            <div id="left" class="panel white">
                <select class="team">
                    <option value="White 1" data-color="white">White 1</option>
                    <option value="White 2" data-color="white">White 2</option>
                    <option value="Green 1" data-color="green">Green 1</option>
                    <option value="Green 2" data-color="green">Green 2</option>
                    <option value="Black 1" data-color="black">Black 1</option>
                    <option value="Black 2" data-color="black">Black 2</option>
                    <option value="Brown 1" data-color="brown">Brown 1</option>
                    <option value="Brown 2" data-color="brown">Brown 2</option>
                </select>
                <div class="score left">0</div>
                <button>-1</button>
            </div>
            <div id="right" class="panel white">
                <select class="team">
                    <option value="White 1" data-color="white">White 1</option>
                    <option value="White 2" data-color="white">White 2</option>
                    <option value="Green 1" data-color="green">Green 1</option>
                    <option value="Green 2" data-color="green">Green 2</option>
                    <option value="Black 1" data-color="black">Black 1</option>
                    <option value="Black 2" data-color="black">Black 2</option>
                    <option value="Brown 1" data-color="brown">Brown 1</option>
                    <option value="Brown 2" data-color="brown">Brown 2</option>
                </select>
                <div class="score right">0</div>
                <button>-1</button>
            </div>
        </div>
    </div>
<script src="jq.min.js"></script>
<script>
    let data = {
            "Group A": [
                "White 1|white",
                "White 2|white",
                "Green 1|green",
                "Green 2|green",
                "Black 1|black",
                "Black 2|black",
                "Brown 1|brown",
                "Brown 2|brown",
            ],
            "Group B": [
                "White 1|white",
                "White 2|white",
                "Green 1|green",
                "Green 2|green",
                "Black 1|black",
                "Black 2|black",
                "Brown 1|brown",
                "Brown 2|brown",
            ],
            "Group C": [
                "White 1|white",
                "White 2|white",
                "Green 1|green",
                "Green 2|green",
                "Black 1|black",
                "Black 2|black",
                "Brown 1|brown",
                "Brown 2|brown",
            ],
        },
        group = $('#group'),
        left = $('#left'),
        right = $('#right'),
        t1 = 0, t2 = 0, gr, tm1, tm2;
    let half = 16,
        game = 31;
    (function($) {
        let changeMyColor = (obj) => {
            let elem = $(obj),
                parent = elem.parents('.panel'),
                color = elem.find('option:selected').data('color');
            parent.attr('class', 'panel');
            parent.addClass(color);
        };
        let changeGroup = (d) => {
            let o = '';
            for(i in d) {
                let r = d[i],
                    a = r.split('|');
                o += '<option value="'+ a[0] +'" data-color="'+ a[1] +'">'+ a[0] +'</option>';
            }
            left.find('.team').html(o);
            right.find('.team').html(o);
            changeMyColor(left.find('.team'));
            changeMyColor(right.find('.team'));
        };
        let init = () => {
            t1 = localStorage.getItem('t1') ?? 0;
            t2 = localStorage.getItem('t2') ?? 0;
            left.find('.score').text(t1);
            right.find('.score').text(t2);

            gr = localStorage.getItem('gr') ?? 'Group A';
            group.val(gr);
            let d = data[gr];
            changeGroup(d);

            tm1 = localStorage.getItem('tm1') ?? d[0].split('|')[0];
            tm2 = localStorage.getItem('tm2') ?? d[0].split('|')[0];
            left.find('.team').val(tm1);
            right.find('.team').val(tm2);
            changeMyColor(left.find('.team'));
            changeMyColor(right.find('.team'));
        };
        $('.panel')
            .on('click', '.score', function(e) {
                e.preventDefault();
                let elem = $(this),
                    val = parseInt(elem.text());
                if(val >= game) return;
                if(elem.hasClass('left')) {
                    t1 = ++val;
                    localStorage.setItem('t1', t1);
                } else {
                    t2 = ++val;
                    localStorage.setItem('t2', t2);
                }
                elem.text(val);
                if(val === half && (t1+t2) < 32) {
                    setTimeout(function() {alert('Change court!');}, 100);
                }
                if(val === game) {
                    setTimeout(function() {alert('Game end!');}, 100);
                }
            })
            .on('click', 'button', function(e) {
                e.preventDefault();
                let elem = $(this),
                    score = elem.siblings('.score'),
                    val = parseInt(score.text());
                if(val <= 0) return;
                score.text(--val);
            });
        $('#change-court').on('click', function(e) {
            e.preventDefault();
            let team, score;
            team = left.find('.team').val();
            score = left.find('.score').text();
            left.find('.team').val(right.find('.team').val());
            left.find('.score').text(right.find('.score').text());
            right.find('.team').val(team);
            right.find('.score').text(score);
            changeMyColor(left.find('.team'));
            changeMyColor(right.find('.team'));
        });
        $('.team').on('change', function() {
            let elem = $(this),
                score = elem.parents('.panel').find('.score');
            if(score.hasClass('left')) {
                tm1 = elem.val();
                localStorage.setItem('tm1', tm1);
            } else {
                tm2 = elem.val();
                localStorage.setItem('tm2', tm2);
            }
            changeMyColor(this);
        });
        group.on('change', function() {
            let elem = $(this),
                group = elem.val(),
                d = data[group];
            tm1 = d[0].split('|')[0];
            tm2 = d[0].split('|')[0];
            localStorage.setItem('gr', group);
            localStorage.setItem('tm1', tm1);
            localStorage.setItem('tm2', tm2);
            changeGroup(d);
        });
        $('#reset').on('click', function(e) {
            e.preventDefault();
            if(confirm('Are you sure you want to reset?') === true) {
                localStorage.removeItem('t1');
                localStorage.removeItem('t2');
                localStorage.removeItem('gr');
                localStorage.removeItem('tm1');
                localStorage.removeItem('tm2');
                init();
            }
        });
        init();
    })(jQuery);
</script>
</body>
</html>
